<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلة حاسبة</title>
<style>
body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;padding:20px}
.box{background:#222;padding:20px;border-radius:20px;width:100%;max-width:320px}
#res{width:100%;height:60px;font-size:28px;text-align:left;border:none;border-radius:10px;padding:10px;background:#000;color:#fff;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:22px;border:none;border-radius:50%;background:#333;color:#fff}
button.op{background:orange}
button.eq{background:green}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">آلة حاسبة</h2>
<input id="res" readonly>
<div class="grid">
<button onclick="c()">C</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button><button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">-</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button>
<button onclick="add('0')">0</button><button onclick="add('.')">.</button><button onclick="del()">⌫</button><button class="eq" onclick="calc()">=</button>
</div>
</div>
<script>
let r=document.getElementById('res');
function add(v){r.value+=v}
function c(){r.value=''}
function del(){r.value=r.value.slice(0,-1)}
function calc(){try{r.value=eval(r.value)}catch(e){r.value='خطأ'}}
</script>
</body>
</html>
